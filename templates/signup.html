<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join the Crown - Mayday</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Josefin+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/static/images/psny-logo.png">
    <link rel="apple-touch-icon" href="/static/images/psny-logo.png">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/menu.js" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <a href="/" class="header-brand">
                <img src="/static/images/psny-logo.png" alt="PSNY" class="psny-logo">
                <span class="header-title">Mayday</span>
            </a>
            <button class="hamburger-menu" aria-label="Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </header>

        <nav class="mobile-nav">
            <a href="/signup">Write</a>
            <a href="/crown/1/visualize">The Crown</a>
            <a href="/contributors">Contributors</a>
            <a href="/about">About</a>
            <a href="https://poetrysocietyny.org/membership" class="nav-button" target="_blank" rel="noopener noreferrer">Membership</a>
        </nav>
        <div class="mobile-nav-overlay"></div>

        <div class="signup-section signup-section--streamlined">
            <p class="signup-intro">
                Write sonnets with strangers. Each completed poem seeds new ones, building an infinite fractal of interconnected verse.
            </p>

            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}

            <div class="signup-box signup-box--primary">
                <form method="POST" action="/signup" class="signup-form">
                    <div class="form-group">
                        <label for="pen_name">Pen Name</label>
                        <input
                            type="text"
                            id="pen_name"
                            name="pen_name"
                            placeholder="How should we call you?"
                            required
                        >
                    </div>

                    <div class="form-group optional-field">
                        <label for="email">Email <span class="optional-label">(optional)</span></label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Stay in touch with PSNY"
                        >
                    </div>

                    <button type="submit" class="submit-btn">Get Paired & Start Writing</button>
                </form>
            </div>

            <div class="signup-divider">
                <span>or</span>
            </div>

            <div class="signup-return">
                <form method="POST" action="/return" class="return-form">
                    <input
                        type="text"
                        id="code"
                        name="code"
                        placeholder="Enter your secret code"
                        required
                        autocomplete="off"
                        spellcheck="false"
                    >
                    <button type="submit" class="return-btn">Return to Poem</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
