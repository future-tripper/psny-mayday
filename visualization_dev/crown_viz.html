<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crown Visualization - Mayday</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Josefin+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="/static/viz_styles.css">
    <script src="/static/menu.js" defer></script>
</head>
<body data-crown-id="{{ crown_id }}">
    <div class="container">
        <header>
            <img src="/static/images/psny-logo.png" alt="PSNY Logo" class="psny-logo">
            <a href="https://poetrysocietyny.org/membership" class="membership-button" target="_blank" rel="noopener noreferrer">Membership</a>
            <button class="hamburger-menu" aria-label="Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <h1>Mayday</h1>
            <p class="tagline">A sonnet crown of epic proportions</p>
        </header>

        <nav class="mobile-nav">
            <a href="/signup">Sign Up</a>
            <a href="/crown/{{ crown_id }}/visualize">The Crown</a>
            <a href="/about">About</a>
            <a href="https://poetrysocietyny.org/membership" class="nav-button" target="_blank" rel="noopener noreferrer">Membership</a>
        </nav>
        <div class="mobile-nav-overlay"></div>

        <!-- Visualization Container -->
        <div class="viz-container">
            <div class="viz-header">
                <h2>The Crown</h2>
                <div class="view-controls">
                    <a href="#" class="view-link active" data-view="orbit">Jewels</a>
                    <a href="#" class="view-link" data-view="lineage">Threads</a>
                    <a href="/crown/{{ crown_id }}" class="view-link">Scroll</a>
                </div>
            </div>

            <!-- Main Visualization Area -->
            <div class="viz-main">
                <div class="stage-wrapper">
                    <div id="orrery-stage" class="viz-stage viz-stage--orrery active" aria-live="polite">
                        <canvas id="orrery-canvas"></canvas>
                        <div id="orrery-overlay" class="orrery-overlay">
                            <div class="overlay-content">
                                <p class="overlay-title">Crown Orrery</p>
                                <p class="overlay-subtitle">Drag to rotate • Scroll to zoom • Click stars to explore</p>
                            </div>
                        </div>
                    </div>
                    <div id="lineage-stage" class="viz-stage viz-stage--lineage" hidden>
                        <div id="lineage-scroll" class="lineage-scroll" role="list"></div>
                    </div>
                    <div id="legacy-stage" class="viz-stage viz-stage--legacy" hidden>
                        <div id="sigma-container" class="sigma-container"></div>
                    </div>
                </div>

                <!-- Info Panel -->
                <div class="info-panel" style="display: none;">
                    <div class="panel-header">
                        <h3 id="panel-title">Sonnet</h3>
                        <button class="close-panel" aria-label="Close panel">×</button>
                    </div>
                    <div class="panel-content">
                        <section id="poet-studio" class="poet-studio" aria-live="polite">
                            <div class="studio-header">
                                <h4 id="studio-title">Select a star to open its poem</h4>
                                <p class="studio-meta" id="studio-meta">Waiting to weave…</p>
                            </div>
                            <div class="studio-lines" id="studio-lines"></div>
                            <div class="studio-actions">
                                <a href="#" id="studio-view-link" class="cta-link" target="_blank" rel="noopener">Open full sonnet →</a>
                            </div>
                        </section>
                    </div>
                </div>
            </div>

            <!-- Loading State -->
            <div class="loading-overlay" id="loading">
                <div class="loading-content">
                    <div class="ornament">✦</div>
                    <p>Weaving the Crown...</p>
                </div>
            </div>
        </div>

    </div>

    <!-- Sigma.js Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/graphology@0.25.4/dist/graphology.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sigma@2.4.0/build/sigma.min.js"></script>
    <script type="module" src="/static/viz/main.js"></script>
</body>
</html>
