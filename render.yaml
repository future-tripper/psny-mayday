services:
  # PostgreSQL Database
  - type: pserv
    name: mayday-db
    env: docker
    plan: free
    region: oregon
    databases:
      - name: mayday
        databaseName: mayday
        user: mayday

  # Web Service
  - type: web
    name: psny-mayday
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DATABASE_URL
        fromDatabase:
          name: mayday-db
          property: connectionString
